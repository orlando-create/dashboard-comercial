name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'One_Page_Comercial_2026.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: indicadores-comercial
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pasta
        run: |
          mkdir -p deploy_dir
          cp One_Page_Comercial_2026.html deploy_dir/index.html

      - name: Criar projeto (se nao existir)
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || echo "Projeto ja existe"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy deploy_dir --project-name="$PROJECT" --branch=main --commit-dirty=true
